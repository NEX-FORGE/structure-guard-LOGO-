<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#075BFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Hexagonal Shield Outline -->
  <polygon points="50,6 88,27 88,73 50,94 12,73 12,27" stroke="url(#cyanGrad)" stroke-width="7" stroke-linejoin="round" fill="none" filter="url(#glow)" />
  
  <!-- Left Building Column -->
  <polygon points="36,44 48,34 48,78 36,86" fill="#00BFFF" />
  <polygon points="36,44 26,50 26,80 36,86" fill="#075BFF" />
  
  <!-- Center Main Skyscraper -->
  <polygon points="48,22 62,34 62,78 48,78" fill="#00E5FF" />
  <polygon points="36,32 48,22 48,78 36,78" fill="#F8FAFC" />
  
  <!-- Right Tower -->
  <polygon points="62,48 72,56 72,78 62,78" fill="#0096C7" />
</svg>

